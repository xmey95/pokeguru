name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, 'task/**']

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Run local tests
        run: npm test -- --maxWorkers=2
      - name: Build Electron app
        run: npm run build
      - name: Install Linux display tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libxss1 libasound2t64 libgbm1
      - name: Exercise offline desktop flow on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e:offline
      - name: Exercise offline desktop flow on Windows
        if: runner.os == 'Windows'
        run: npm run test:e2e:offline
      - name: Check accessible navigation at 200% scale on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/scale-accessibility-live.mjs
      - name: Check accessible navigation at 200% scale on Windows
        if: runner.os == 'Windows'
        run: node tests/scale-accessibility-live.mjs
      - name: Exercise catalog set coverage on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/catalog-ui-live.mjs
      - name: Exercise catalog set coverage on Windows
        if: runner.os == 'Windows'
        run: node tests/catalog-ui-live.mjs
      - name: Exercise recoverable catalog sync on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/catalog-auto-sync-electron-live.mjs
      - name: Exercise recoverable catalog sync on Windows
        if: runner.os == 'Windows'
        run: node tests/catalog-auto-sync-electron-live.mjs
      - name: Check cached Catalog images on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/catalog-card-ui-live.mjs
      - name: Check cached Catalog images on Windows
        if: runner.os == 'Windows'
        run: node tests/catalog-card-ui-live.mjs
      - name: Exercise long catalog navigation on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/catalog-large-ui-live.mjs
      - name: Exercise long catalog navigation on Windows
        if: runner.os == 'Windows'
        run: node tests/catalog-large-ui-live.mjs
      - name: Exercise Standard legality on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/standard-legality-live.mjs
      - name: Exercise Standard legality on Windows
        if: runner.os == 'Windows'
        run: node tests/standard-legality-live.mjs
      - name: Exercise saved tournament on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/tournament-ui-live.mjs --offline
      - name: Exercise saved tournament on Windows
        if: runner.os == 'Windows'
        run: node tests/tournament-ui-live.mjs --offline
      - name: Exercise AI settings without Codex on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/ai-settings-offline.mjs
      - name: Exercise AI settings without Codex on Windows
        if: runner.os == 'Windows'
        run: node tests/ai-settings-offline.mjs
      - name: Exercise deck threads without Codex on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/threads-ai-live.mjs --offline
      - name: Exercise deck threads without Codex on Windows
        if: runner.os == 'Windows'
        run: node tests/threads-ai-live.mjs --offline
      - name: Check project archive and reopen on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/project-archive-ui-live.mjs
      - name: Check project archive and reopen on Windows
        if: runner.os == 'Windows'
        run: node tests/project-archive-ui-live.mjs
      - name: Check first Codex message recovery on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/thread-opening-ui-live.mjs
      - name: Check first Codex message recovery on Windows
        if: runner.os == 'Windows'
        run: node tests/thread-opening-ui-live.mjs
      - name: Check safe Thread Markdown on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/thread-markdown-ui-live.mjs
      - name: Check safe Thread Markdown on Windows
        if: runner.os == 'Windows'
        run: node tests/thread-markdown-ui-live.mjs
      - name: Check persistent candidate access on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/thread-candidate-access-ui-live.mjs
      - name: Check persistent candidate access on Windows
        if: runner.os == 'Windows'
        run: node tests/thread-candidate-access-ui-live.mjs
      - name: Exercise candidate adoption on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/deck-adoption-live.mjs
      - name: Exercise candidate adoption on Windows
        if: runner.os == 'Windows'
        run: node tests/deck-adoption-live.mjs
      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: npm run package:linux
      - name: Smoke packaged Linux app
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/package-smoke.mjs release/linux-unpacked/pokeguru
      - name: Smoke AppImage payload
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE"/release/*.AppImage --appimage-extract >/dev/null
          xvfb-run -a node "$GITHUB_WORKSPACE/tests/package-smoke.mjs" "$RUNNER_TEMP/squashfs-root/AppRun"
      - name: Package Windows installer
        if: runner.os == 'Windows'
        run: npm run package:win
      - name: Smoke packaged Windows app
        if: runner.os == 'Windows'
        run: node tests/package-smoke.mjs release/win-unpacked/Pokeguru.exe
      - name: Smoke installed Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem -LiteralPath release -Filter '*-setup.exe' | Select-Object -First 1).FullName
          $target = Join-Path $env:RUNNER_TEMP 'pokeguru-test-install'
          $install = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$target" -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited $($install.ExitCode)" }
          node tests/package-smoke.mjs (Join-Path $target 'Pokeguru.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Installed app smoke failed' }
          $uninstall = Start-Process -FilePath (Join-Path $target 'Uninstall Pokeguru.exe') -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited $($uninstall.ExitCode)" }
      - name: Install Codex CLI for isolated Linux protocol check
        if: runner.os == 'Linux'
        run: npm install --prefix "$RUNNER_TEMP/pokeguru-codex" --no-audit --no-fund @openai/codex@0.164.0
      - name: Check Codex login protocol with an isolated profile on Linux
        if: runner.os == 'Linux'
        env:
          POKEGURU_CODEX_LOGIN_LIVE: '1'
          POKEGURU_CODEX_BIN: ${{ runner.temp }}/pokeguru-codex/node_modules/.bin/codex
        run: npx vitest run tests/codex-login-live.test.ts

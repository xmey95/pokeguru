name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    env:
      POKEGURU_AUTO_SYNC: '0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: windows-2022
          - os: macos-15-intel
            macArch: x64
          - os: macos-15
            macArch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Run local tests
        run: npm test -- --maxWorkers=2 --testTimeout=15000
      - name: Build Electron app
        run: npm run build
      - name: Verify daily sync startup on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/daily-sync-electron-live.mjs
        env:
          POKEGURU_AUTO_SYNC: '1'
      - name: Verify daily sync startup on Windows
        if: runner.os == 'Windows'
        run: node tests/daily-sync-electron-live.mjs
        env:
          POKEGURU_AUTO_SYNC: '1'
      - name: Install Linux display tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libxss1 libasound2t64 libgbm1
      - name: Verify automatic AI recovery on Linux
        if: runner.os == 'Linux'
        env:
          POKEGURU_LIFECYCLE_E2E: '1'
        run: xvfb-run -a npx vitest run tests/ai-lifecycle-electron.test.ts
      - name: Verify automatic AI recovery on Windows and macOS
        if: runner.os != 'Linux'
        env:
          POKEGURU_LIFECYCLE_E2E: '1'
        run: npx vitest run tests/ai-lifecycle-electron.test.ts
      - name: Verify backend worker responsiveness on Linux
        if: runner.os == 'Linux'
        env:
          POKEGURU_WORKER_E2E: '1'
        run: xvfb-run -a npx vitest run tests/ai-worker-responsive-electron.test.ts
      - name: Verify backend worker responsiveness on Windows and macOS
        if: runner.os != 'Linux'
        env:
          POKEGURU_WORKER_E2E: '1'
        run: npx vitest run tests/ai-worker-responsive-electron.test.ts
      - name: Verify local collection and paged histories on Linux
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a node tests/ai-collection-ui-live.mjs
          xvfb-run -a node tests/history-pagination-ui.mjs
      - name: Verify local collection and paged histories on Windows and macOS
        if: runner.os != 'Linux'
        run: |
          node tests/ai-collection-ui-live.mjs
          node tests/history-pagination-ui.mjs
      - name: Check desktop feedback flows on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/desktop-feedback-ui.mjs
      - name: Check desktop feedback flows on Windows and macOS
        if: runner.os != 'Linux'
        run: node tests/desktop-feedback-ui.mjs
      - name: Exercise TCG Live deck export on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/export-live.mjs
      - name: Exercise TCG Live deck export on Windows
        if: runner.os == 'Windows'
        run: node tests/export-live.mjs
      - name: Check Electron menu and development shortcuts on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/electron-menu-live.mjs
      - name: Check Electron menu and development shortcuts on Windows
        if: runner.os == 'Windows'
        run: node tests/electron-menu-live.mjs
      - name: Exercise offline desktop flow on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e:offline
      - name: Exercise offline desktop flow on Windows
        if: runner.os == 'Windows'
        run: npm run test:e2e:offline
      - name: Check accessible navigation at 200% scale on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/scale-accessibility-live.mjs
      - name: Check accessible navigation at 200% scale on Windows
        if: runner.os == 'Windows'
        run: node tests/scale-accessibility-live.mjs
      - name: Exercise catalog set coverage on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/catalog-ui-live.mjs
      - name: Exercise catalog set coverage on Windows
        if: runner.os == 'Windows'
        run: node tests/catalog-ui-live.mjs
      - name: Exercise recoverable catalog sync on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/catalog-auto-sync-electron-live.mjs
      - name: Exercise recoverable catalog sync on Windows
        if: runner.os == 'Windows'
        run: node tests/catalog-auto-sync-electron-live.mjs
      - name: Check cached Catalog images on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/catalog-card-ui-live.mjs
      - name: Check cached Catalog images on Windows
        if: runner.os == 'Windows'
        run: node tests/catalog-card-ui-live.mjs
      - name: Exercise long catalog navigation on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/catalog-large-ui-live.mjs
      - name: Exercise long catalog navigation on Windows
        if: runner.os == 'Windows'
        run: node tests/catalog-large-ui-live.mjs
      - name: Exercise Standard legality on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/standard-legality-live.mjs
      - name: Exercise Standard legality on Windows
        if: runner.os == 'Windows'
        run: node tests/standard-legality-live.mjs
      - name: Check deck card detail on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/reconciliation-live.mjs
      - name: Check deck card detail on Windows
        if: runner.os == 'Windows'
        run: node tests/reconciliation-live.mjs
      - name: Exercise saved tournament on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/tournament-ui-live.mjs --offline
      - name: Exercise saved tournament on Windows
        if: runner.os == 'Windows'
        run: node tests/tournament-ui-live.mjs --offline
      - name: Check global job alerts on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/job-alerts-ui-live.mjs
      - name: Check global job alerts on Windows
        if: runner.os == 'Windows'
        run: node tests/job-alerts-ui-live.mjs
      - name: Exercise AI settings without Codex on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/ai-settings-offline.mjs
      - name: Exercise AI settings without Codex on Windows
        if: runner.os == 'Windows'
        run: node tests/ai-settings-offline.mjs
      - name: Exercise deck threads without Codex on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/threads-ai-live.mjs --offline
      - name: Exercise deck threads without Codex on Windows
        if: runner.os == 'Windows'
        run: node tests/threads-ai-live.mjs --offline
      - name: Check unified Thread composer on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/thread-composer-ui-live.mjs
      - name: Check unified Thread composer on Windows
        if: runner.os == 'Windows'
        run: node tests/thread-composer-ui-live.mjs
      - name: Check project archive and reopen on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/project-archive-ui-live.mjs
      - name: Check project archive and reopen on Windows
        if: runner.os == 'Windows'
        run: node tests/project-archive-ui-live.mjs
      - name: Check first Codex message recovery on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/thread-opening-ui-live.mjs
      - name: Check first Codex message recovery on Windows
        if: runner.os == 'Windows'
        run: node tests/thread-opening-ui-live.mjs
      - name: Check safe Thread Markdown on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/thread-markdown-ui-live.mjs
      - name: Check safe Thread Markdown on Windows
        if: runner.os == 'Windows'
        run: node tests/thread-markdown-ui-live.mjs
      - name: Check persistent candidate access on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/thread-candidate-access-ui-live.mjs
      - name: Check persistent candidate access on Windows
        if: runner.os == 'Windows'
        run: node tests/thread-candidate-access-ui-live.mjs
      - name: Check Thread composer keyboard on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/thread-composer-keyboard-live.mjs
      - name: Check Thread composer keyboard on Windows
        if: runner.os == 'Windows'
        run: node tests/thread-composer-keyboard-live.mjs
      - name: Check Matchup phases and recovery on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/matchup-switcher-ui-live.mjs --phases
      - name: Check Matchup phases and recovery on Windows
        if: runner.os == 'Windows'
        run: node tests/matchup-switcher-ui-live.mjs --phases
      - name: Exercise candidate adoption on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/deck-adoption-live.mjs
      - name: Exercise candidate adoption on Windows
        if: runner.os == 'Windows'
        run: node tests/deck-adoption-live.mjs
      - name: Exercise list history and linked Thread on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/deck-history-live.mjs
      - name: Exercise list history and linked Thread on Windows
        if: runner.os == 'Windows'
        run: node tests/deck-history-live.mjs
      - name: Check list footer layout and keyboard on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/deck-footer-ui-live.mjs
      - name: Check list footer layout and keyboard on Windows
        if: runner.os == 'Windows'
        run: node tests/deck-footer-ui-live.mjs
      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: npm run package:linux
      - name: Smoke packaged Linux app
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/package-smoke.mjs release/linux-unpacked/pokeguru
      - name: Smoke AppImage payload
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE"/release/*.AppImage --appimage-extract >/dev/null
          xvfb-run -a node "$GITHUB_WORKSPACE/tests/package-smoke.mjs" "$RUNNER_TEMP/squashfs-root/AppRun"
      - name: Package Windows installer
        if: runner.os == 'Windows'
        run: npm run package:win
      - name: Smoke packaged Windows app
        if: runner.os == 'Windows'
        run: node tests/package-smoke.mjs release/win-unpacked/Pokeguru.exe
      - name: Smoke installed Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem -LiteralPath release -Filter '*-setup.exe' | Select-Object -First 1).FullName
          $target = Join-Path $env:RUNNER_TEMP 'pokeguru-test-install'
          $install = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$target" -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited $($install.ExitCode)" }
          node tests/package-smoke.mjs (Join-Path $target 'Pokeguru.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Installed app smoke failed' }
          $uninstall = Start-Process -FilePath (Join-Path $target 'Uninstall Pokeguru.exe') -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited $($uninstall.ExitCode)" }
      - name: Package macOS DMG
        if: runner.os == 'macOS'
        env:
          # Firma ad hoc: non usa certificati o secret nei job delle PR.
          CSC_FOR_PULL_REQUEST: 'true'
        run: npm run package:mac
      - name: Verify and smoke mounted macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/smoke-mac-dmg.sh release/*.dmg "${{ matrix.macArch }}" --adhoc
      - name: Check included Codex login protocol with an isolated profile
        env:
          POKEGURU_CODEX_LOGIN_LIVE: '1'
        run: npx vitest run tests/codex-login-live.test.ts
      - name: Check durable AI workflow on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/ai-workflow-ui-live.mjs
      - name: Check durable AI workflow on Windows
        if: runner.os == 'Windows'
        run: node tests/ai-workflow-ui-live.mjs

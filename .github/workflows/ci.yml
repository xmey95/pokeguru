name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, 'task/**']

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Run local tests
        run: npm test
      - name: Build Electron app
        run: npm run build
      - name: Install Linux display tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libxss1 libasound2t64 libgbm1
      - name: Exercise offline desktop flow on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e:offline
      - name: Exercise offline desktop flow on Windows
        if: runner.os == 'Windows'
        run: npm run test:e2e:offline

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    env:
      POKEGURU_AUTO_SYNC: '0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            command: package:linux
            binary: release/linux-unpacked/pokeguru
            artifact: release/*.AppImage
            name: linux
          - os: windows-2022
            command: package:win
            binary: release/win-unpacked/Pokeguru.exe
            artifact: release/*-setup.exe
            name: windows
          - os: macos-15-intel
            command: package:mac
            artifact: release/*.dmg
            name: macos-x64
            macArch: x64
          - os: macos-15
            command: package:mac
            artifact: release/*.dmg
            name: macos-arm64
            macArch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - name: Install Linux display tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libxss1 libasound2t64 libgbm1
      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: npm run package:linux
      - name: Package Windows installer
        if: runner.os == 'Windows'
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run package:win
      - name: Package macOS DMG
        if: runner.os == 'macOS'
        run: npm run package:mac
      - name: Verify Windows publisher signature when configured
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        run: |
          if ($env:WIN_CSC_LINK) {
            foreach ($file in @('release/win-unpacked/Pokeguru.exe') +
              @(Get-ChildItem -LiteralPath release -Filter '*-setup.exe' | Select-Object -ExpandProperty FullName)) {
              if ((Get-AuthenticodeSignature -LiteralPath $file).Status -ne 'Valid') {
                throw "Windows signature not valid: $file"
              }
            }
          }
      - name: Smoke packaged app on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/package-smoke.mjs "${{ matrix.binary }}"
      - name: Smoke AppImage payload
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE"/release/*.AppImage --appimage-extract >/dev/null
          xvfb-run -a node "$GITHUB_WORKSPACE/tests/package-smoke.mjs" "$RUNNER_TEMP/squashfs-root/AppRun"
      - name: Smoke packaged app on Windows
        if: runner.os == 'Windows'
        run: node tests/package-smoke.mjs "${{ matrix.binary }}"
      - name: Smoke installed Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem -LiteralPath release -Filter '*-setup.exe' | Select-Object -First 1).FullName
          $target = Join-Path $env:RUNNER_TEMP 'pokeguru-test-install'
          $install = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$target" -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited $($install.ExitCode)" }
          node tests/package-smoke.mjs (Join-Path $target 'Pokeguru.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Installed app smoke failed' }
          $uninstall = Start-Process -FilePath (Join-Path $target 'Uninstall Pokeguru.exe') -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited $($uninstall.ExitCode)" }
      - name: Verify and smoke mounted macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/smoke-mac-dmg.sh release/*.dmg "${{ matrix.macArch }}"
      - name: Record package provenance
        run: node scripts/release-provenance.mjs create ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: |
            ${{ matrix.artifact }}
            release/provenance-${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 14

  attest:
    name: Attest release packages
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test provenance checks
        run: node --test tests/release-provenance-check.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: release
      - name: Verify artifact digests and build identity
        run: node scripts/release-provenance.mjs verify-all
      - name: Sign build provenance
        uses: actions/attest@v4
        with:
          subject-path: 'release/*'

  publish:
    name: Publish GitHub release
    needs: [package, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: release
      - name: Verify downloaded packages and manifests
        run: node scripts/release-provenance.mjs verify-all
      - name: Verify signed build provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in release/*.AppImage release/*-setup.exe release/*.dmg release/provenance-*.json; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --source-digest "$GITHUB_SHA" --source-ref refs/heads/main \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" >/dev/null
          done
      - name: Check package version and files
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The release version must be X.Y.Z" >&2
            exit 1
          fi
          test "$(find release -maxdepth 1 -name '*.AppImage' | wc -l)" -eq 1
          test "$(find release -maxdepth 1 -name '*-setup.exe' | wc -l)" -eq 1
          test "$(find release -maxdepth 1 -name '*-macos-*.dmg' | wc -l)" -eq 2
          echo "TAG=v$version" >> "$GITHUB_ENV"
          (cd release && sha256sum ./*.AppImage ./*-setup.exe ./*.dmg ./provenance-*.json > SHA256SUMS.txt)
      - name: Create and publish verified release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=$(gh api -i "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" 2>/dev/null | head -n 1 | awk '{print $2}' || true)
          case "$status" in
            404) ;;
            200) echo "Tag ${TAG} already exists; refusing to replace a release." >&2; exit 1 ;;
            *) echo "Cannot verify tag ${TAG} (HTTP ${status:-unknown})." >&2; exit 1 ;;
          esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Pokeguru $TAG" --draft --generate-notes --notes 'I pacchetti macOS Intel e Apple Silicon sono al momento privi di firma Apple e notarizzazione; macOS potrebbe richiedere di autorizzare manualmente l’apertura nelle impostazioni di sicurezza.'
          gh release upload "$TAG" release/*.AppImage release/*-setup.exe release/*.dmg release/provenance-*.json release/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length' | grep -qx '9'
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
